<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>WhatsApp</title>

<link rel="stylesheet" href="../css/sidebar.css">

<link rel="stylesheet" href="../css/page_whatsapp.css">

</head>


<body>

<div id="sidebarContainer"></div>


<div class="page-content">

<div class="container">


<div class="topbar">

<h2>
WhatsApp Management
</h2>

</div>



<div class="grid">


<div class="card">

<h3>
Messages Sent
</h3>

<p id="sentCount">
0
</p>

</div>



<div class="card">

<h3>
Delivered
</h3>

<p id="deliveredCount">
0
</p>

</div>



<div class="card">

<h3>
Read
</h3>

<p id="readCount">
0
</p>

</div>



<div class="card">

<h3>
Active Sessions
</h3>

<p id="sessionCount">
0
</p>

</div>



</div>



<div class="section">

<h3>
Recent Messages
</h3>


<table>

<thead>

<tr>

<th>
Customer
</th>

<th>
Message
</th>

<th>
Status
</th>

</tr>

</thead>


<tbody id="messageTable">

<tr>

<td colspan="3">
No messages yet
</td>

</tr>

</tbody>


</table>


</div>


</div>

</div>



<script
type="module"
src="../js/page_whatsapp.js">
</script>


</body>

</html>
