<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Broadcast Studio</title>

    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/page_broadcast.css">
</head>

<body>

    <div id="sidebarContainer">
        <div class="sidebar">
            <div class="logo">
                <h2>WhatsApp CRM</h2>
            </div>

            <nav>
                <a href="dashboard.html" data-page="dashboard">🏠 Dashboard</a>
                <a href="customers.html" data-page="customers">👥 Customers</a>
                <a href="products.html" data-page="products">📦 Products</a>
                <a href="broadcast.html" data-page="broadcast" class="active">📢 Broadcast</a>
                <a href="templates.html" data-page="templates">📜 Templates</a>
                <a href="#">📊 Reports</a>
            </nav>

            <button id="sidebarLogout">Logout</button>
        </div>
    </div>

    <div class="page-content">
        <h2>WhatsApp Broadcast</h2>

        <div class="broadcast-layout">

            <!-- LEFT COLUMN: Audience Targeting & Activity Filters -->
            <div class="broadcast-box">
                <h3>Customer Activity Filters</h3>

                <div class="filter-grid">
                    <div class="form-group">
                        <label for="windowFilter">24-Hour Session Window</label>
                        <select id="windowFilter" class="form-control">
                            <option value="">All Windows</option>
                            <option value="active">Active (Free Session Open)</option>
                            <option value="expired">Expired (Template Required)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="activityFilter">Activity Status</label>
                        <select id="activityFilter" class="form-control">
                            <option value="">All Activity Tiers</option>
                            <option value="recent">Active (Last 7 Days)</option>
                            <option value="inactive_30">Inactive (> 30 Days)</option>
                            <option value="never">Never Engaged</option>
                        </select>
                    </div>
                </div>

                <div class="filter-grid">
                    <div class="form-group">
                        <label for="orderFilter">Order Activity</label>
                        <select id="orderFilter" class="form-control">
                            <option value="">All Orders Statuses</option>
                            <option value="has_orders">Has Placed Orders</option>
                            <option value="no_orders">No Orders Yet</option>
                            <option value="abandoned_cart">Abandoned Cart</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cityFilter">City Filter</label>
                        <select id="cityFilter" class="form-control">
                            <option value="">All Cities</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="searchCustomer">Search Customer</label>
                    <input type="text" id="searchCustomer" class="form-control" placeholder="Search name, phone, or department...">
                </div>

                <div class="customer-actions">
                    <div id="selectedCount" class="selected-badge">
                        Selected: 0 Recipients
                    </div>
                    <div class="action-buttons">
                        <button id="selectAll" class="btn-secondary">Select All</button>
                        <button id="clearAll" class="btn-secondary">Clear</button>
                    </div>
                </div>

                <div id="customerList" class="customer-list-box">
                    Loading audience list...
                </div>
            </div>

            <!-- RIGHT COLUMN: Message Composer & Live Preview -->
            <div class="broadcast-box">
                <h3>Message Composer</h3>

                <!-- Message Type Selector -->
                <div class="type-selector">
                    <button type="button" class="type-btn active" data-type="INTERACTIVE">Interactive Msg</button>
                    <button type="button" class="type-btn" data-type="MEDIA">Media Msg</button>
                    <button type="button" class="type-btn" data-type="TEMPLATE">Approved Template</button>
                </div>

                <!-- Template Selector (Shown when TEMPLATE selected) -->
                <div id="templateSelectionGroup" class="form-group is-hidden">
                    <label for="templateSelect">Select HSM Approved Template</label>
                    <select id="templateSelect" class="form-control">
                        <option value="">-- Select Template --</option>
                    </select>
                </div>

                <!-- Media Input (Shown when MEDIA selected) -->
                <div id="mediaGroup" class="form-group is-hidden">
                    <label for="mediaUrl">Header Banner / Media URL</label>
                    <input type="url" id="mediaUrl" class="form-control" placeholder="https://example.com/banner.jpg">
                </div>

                <!-- Variable Insertion Pills -->
                <div class="form-group">
                    <label>Insert Personalization Variable:</label>
                    <div class="variable-pills">
                        <button type="button" class="var-btn" data-var="{{name}}">{{name}}</button>
                        <button type="button" class="var-btn" data-var="{{city}}">{{city}}</button>
                        <button type="button" class="var-btn" data-var="{{department}}">{{department}}</button>
                    </div>
                </div>

                <!-- Message Body -->
                <div class="form-group">
                    <label for="messageBody">Message Content</label>
                    <textarea id="messageBody" rows="4" class="form-control" placeholder="Type your WhatsApp broadcast message here..."></textarea>
                </div>

                <!-- Quick Reply Auto-Response Configurator -->
                <div id="buttonsGroup" class="form-group">
                    <label>Quick Reply Auto-Response Buttons (Max 3)</label>
                    <div id="buttonsContainer">
                        <div class="button-input-row">
                            <input type="text" class="form-control reply-btn-input" placeholder="Button 1" value="View Catalog">
                        </div>
                        <div class="button-input-row">
                            <input type="text" class="form-control reply-btn-input" placeholder="Button 2" value="Talk to Agent">
                        </div>
                    </div>
                    <button type="button" id="addButtonRow" class="btn-add-button">+ Add Button</button>
                </div>

                <!-- WhatsApp Phone Live Preview -->
                <div class="phone-mockup">
                    <h4 class="preview-title">Live WhatsApp Preview</h4>
                    <div class="wa-bubble">
                        <img id="previewMedia" class="wa-header-img" src="" alt="Media Header">
                        <div id="previewText" class="wa-body-text">Type a message to preview...</div>
                        
                        <div id="previewButtons" class="wa-buttons-container">
                            <!-- Buttons rendered dynamically via JS -->
                        </div>
                        
                        <div class="wa-timestamp">16:00 ✓✓</div>
                    </div>
                </div>

                <button id="sendBroadcast" class="btn-dispatch">
                    Send Broadcast
                </button>

                <div id="result" class="result-status"></div>
            </div>

        </div>
    </div>

    <script type="module" src="../js/page_broadcast.js"></script>
</body>

</html>
