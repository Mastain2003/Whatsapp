<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Templates</title>

    <link rel="stylesheet"
          href="../css/sidebar.css">

    <link rel="stylesheet"
          href="../css/templates.css">

</head>

<body>

<div id="sidebarContainer"></div>

<div class="page-content">
    <div class="templates-container">

    <div class="templates-left">

        <input
            type="text"
            id="searchTemplate"
            placeholder="Search template...">

        <div id="templateList"></div>

    </div>


    <div class="templates-middle">

        <div id="templateDetails">

            <div class="empty-state">

                Select a template

            </div>

        </div>

    </div>


    <div class="templates-right">

        <h3>Preview</h3>

        <div id="templatePreview">

            <div class="phone-preview">

                Select a template

            </div>

        </div>

    </div>

    </div>

</div>


<script
type="module"
src="../js/page_templates.js">
</script>

</body>

</html>
