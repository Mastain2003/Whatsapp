<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Templates</title>

    <link rel="stylesheet"
          href="../css/sidebar.css">

    <link rel="stylesheet"
          href="../css/templates.css">

</head>

<body>

<div id="sidebarContainer"></div>

<div class="page-content">

    <div class="templates-container">

        <div class="templates-header">

            <h2>
                WhatsApp Templates
            </h2>

            <button
                id="refreshTemplates">

                🔄 Refresh

            </button>

        </div>


        <div class="templates-layout">


            <!-- LEFT PANEL -->

            <div class="template-list-panel">

                <div class="search-box">

                    <input
                        type="text"
                        id="searchTemplate"
                        placeholder="Search templates...">

                </div>

                <div
                    id="templateList"
                    class="template-list">

                </div>

            </div>



            <!-- MIDDLE PANEL -->

            <div class="template-details-panel">

                <h3>
                    Template Details
                </h3>

                <div id="templateDetails">

                    <div class="placeholder">

                        Select a template

                    </div>

                </div>

            </div>



            <!-- RIGHT PANEL -->

            <div class="template-preview-panel">

                <h3>

                    WhatsApp Preview

                </h3>

                <div class="phone-preview">

                    <div class="phone-header">

                        WhatsApp Business

                    </div>

                    <div
                        id="templatePreview"
                        class="chat-area">

                        <div class="placeholder">

                            Preview will appear here

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<script
type="module"
src="../js/templates.js">
</script>

</body>

</html>
