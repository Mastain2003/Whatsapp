<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catalog Products</title>

    <link
        rel="stylesheet"
        href="../css/products.css"
    >

</head>


<body>

    <div class="page-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div id="sidebar"></div>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">

            <!-- HEADER -->

            <header class="page-header">

                <div>

                    <h1>Catalog Products</h1>

                    <p class="page-subtitle">
                        Products from your Meta Commerce Catalog
                    </p>

                </div>


                <div class="view-toggle">

                    <button
                        id="tileViewButton"
                        class="view-button active"
                        type="button"
                    >
                        Tiles
                    </button>


                    <button
                        id="listViewButton"
                        class="view-button"
                        type="button"
                    >
                        List
                    </button>

                </div>

            </header>


            <!-- SEARCH -->

            <section class="search-section">

                <div class="search-box">

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search products..."
                        autocomplete="off"
                    >

                    <button
                        id="searchButton"
                        type="button"
                    >
                        Search
                    </button>

                </div>

            </section>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message hidden"
            ></div>


            <!-- TILE VIEW -->

            <section
                id="tileView"
                class="product-grid"
            ></section>


            <!-- LIST VIEW -->

            <section
                id="listView"
                class="table-wrapper hidden"
            >

                <table>

                    <thead>

                        <tr>

                            <th>Product</th>

                            <th>Retailer ID</th>

                            <th>Price</th>

                            <th>Availability</th>

                            <th>Product ID</th>

                        </tr>

                    </thead>


                    <tbody id="productList"></tbody>

                </table>

            </section>

        </main>

    </div>


    <!-- PRODUCT MODAL -->

    <div
        id="productModal"
        class="modal hidden"
    >

        <div
            id="modalOverlay"
            class="modal-overlay"
        ></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalProductName"
        >

            <button
                id="closeModal"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <div id="productDetails"></div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="../js/page_products.js"
    ></script>

</body>

</html>
