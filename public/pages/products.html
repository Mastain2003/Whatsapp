<html>

Products
</title>

<link rel="stylesheet"
href="../css/sidebar.css">

<link rel="stylesheet"
href="../css/page_products.css">

</head>


<body>


<div id="sidebarContainer">

    <div class="sidebar">

        <div class="logo">

            <h2>WhatsApp CRM</h2>

        </div>


        <nav>

            <a href="dashboard.html"
               data-page="dashboard">

                🏠 Dashboard

            </a>


            <a href="customers.html"
               data-page="customers">

                👥 Customers

            </a>


            <a href="products.html"
               data-page="products">

                📦 Products

            </a>


            <a href="broadcast.html"
               data-page="broadcast">

            <a href="templates.html"
               data-page="templates">

            </a>


            <a href="#">

                📊 Reports

            </a>

        </nav>


        <button id="sidebarLogout">

            Logout

        </button>

    </div>

</div>



<div class="page-content">

    <div class="page-container">


        <!-- Header -->

        <div class="header">

            <div>

                <h2>
                    Catalog Products
                </h2>

                <p class="subtitle">
                    Products from your Meta Commerce Catalog
                </p>

            </div>


            <div class="view-toggle">

                <button
                    id="tileViewBtn"
                    class="view-btn active"
                    type="button">

                    ▦ Tiles

                </button>


                <button
                    id="listViewBtn"
                    class="view-btn"
                    type="button">

                    ☰ List

                </button>

            </div>

        </div>



        <!-- Search -->

        <div class="search-box">

            <input
                id="search"
                type="text"
                placeholder="Search catalog products">


            <button
                id="searchBtn"
                type="button">

                Search

            </button>

        </div>



        <div id="message"></div>



        <!-- Tile View -->

        <div
            id="tileView"
            class="product-grid">

        </div>



        <!-- List View -->

        <div
            id="listView"
            class="table-wrapper hidden">

            <table>

                <thead>

                    <tr>

                        <th>
                            Image
                        </th>

                        <th>
                            Product ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Description
                        </th
