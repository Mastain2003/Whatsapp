<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
Products
</title>

<link rel="stylesheet"
href="../css/sidebar.css">

<link rel="stylesheet"
href="../css/page_products.css">

</head>


<body>

<div id="sidebarContainer">

    <div class="sidebar">

        <div class="logo">

            <h2>WhatsApp CRM</h2>

        </div>


        <nav>

            <a href="dashboard.html"
               data-page="dashboard">

                🏠 Dashboard

            </a>


            <a href="customers.html"
               data-page="customers">

                👥 Customers

            </a>


            <a href="products.html"
               data-page="products">

                📦 Products

            </a>


            <a href="broadcast.html"
               data-page="broadcast">

                Broadcast

            </a>


            <a href="templates.html"
               data-page="templates">

                Templates

            </a>


            <a href="#">

                📊 Reports

            </a>

        </nav>


        <button id="sidebarLogout">

            Logout

        </button>

    </div>

</div>



<div class="page-content">

    <div class="page-container">


        <div class="header">

            <div>

                <h2>
                    Catalog Products
                </h2>

                <p class="subtitle">
                    Products from your Meta Commerce Catalog
                </p>

            </div>


            <div class="view-toggle">

                <button
                    id="tileViewBtn"
                    class="view-button"
                    type="button">

                    ▦ Tiles

                </button>


                <button
                    id="listViewBtn"
                    class="view-button"
                    type="button">

                    ☷ List

                </button>

            </div>

        </div>



        <div class="search-box">

            <input
                id="search"
                type="text"
                placeholder="Search catalog products">

            <button
                id="searchBtn"
                type="button">

                Search

            </button>

        </div>



        <div id="message"></div>



        <!-- TILE VIEW -->

        <div
            id="tileView"
            class="product-grid">

        </div>



        <!-- LIST VIEW -->

        <div
            id="listView"
            class="table-wrapper hidden">

            <table>

                <thead>

                    <tr>

                        <th>
                            Image
                        </th>

                        <th>
                            Product ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Availability
                        </th>

                    </tr>

                </thead>


                <tbody id="productList">

                </tbody>

            </table>

        </div>

    </div>

</div>



<!-- PRODUCT MODAL -->

<div
    id="productModal"
    class="modal hidden">

    <div
        id="modalOverlay"
        class="modal-overlay">
    </div>


    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalProductName">


        <button
            id="closeModal"
            class="modal-close"
            type="button"
            aria-label="Close">

            ×

        </button>


        <div id="productDetails"
             class="product-details">

        </div>

    </div>

</div>



<script
type="module"
src="../js/page_products.js">
</script>


</body>

</html>
